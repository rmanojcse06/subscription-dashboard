services:
  app:
    build: .
    image: subscription-dashboard
    # Bound to localhost only: the API can reveal stored keys and has no login.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: backend/.env  # SUBDASH_MASTER_KEY; copy backend/.env.example to create it
    volumes:
      - ./backend/data:/app/backend/data      # data DB: history and encrypted keys (never committed)
      - ./backend/config:/app/backend/config  # config DB: profile, accounts, widgets (committed)
    restart: unless-stopped
